apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    deployment.kubernetes.io/revision: '9'
  name: junismp
  namespace: minecraft
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: junismp
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: junismp
    spec:
      containers:
      - env:
        - name: BACKUP_INTERVAL
          value: 24h
        - name: INITIAL_DELAY
          value: 5m
        - name: PRUNE_BACKUPS_DAYS
          value: '0'
        - name: PRUNE_BACKUPS_COUNT
          value: '7'
        - name: RCON_HOST
          value: localhost
        - name: RCON_PASSWORD
          valueFrom:
            secretKeyRef:
              key: rcon-password
              name: junismp-secrets
        image: itzg/mc-backup
        imagePullPolicy: Always
        name: mc-backup
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /data
          name: data
          readOnly: true
        - mountPath: /backups
          name: backup-data
      - env:
        - name: EULA
          value: 'TRUE'
        - name: TYPE
          value: FABRIC
        - name: VERSION
          value: '26.2'
        - name: FABRIC_LOADER_VERSION
          value: 0.19.5
        - name: MEMORY
          value: 6G
        - name: USE_AIKAR_FLAGS
          value: 'true'
        - name: JVM_OPTS
          value: -Xms6G -Xmx6G -XX:+UseG1GC
        - name: MAX_PLAYERS
          value: '20'
        - name: MODE
          value: survival
        - name: DIFFICULTY
          value: normal
        - name: MOTD
          value: "\xA76\xA7ljuni's smp\n\xA77my little world! ping @kutejuni for whitelist"
        - name: ENABLE_RCON
          value: 'true'
        - name: RCON_PASSWORD
          valueFrom:
            secretKeyRef:
              key: rcon-password
              name: junismp-secrets
        - name: VIEW_DISTANCE
          value: '7'
        - name: SIMULATION_DISTANCE
          value: '4'
        - name: SYNC_CHUNK_WRITES
          value: 'false'
        - name: MAX_CHAINED_NEIGHBOR_UPDATES
          value: '10000'
        - name: ENABLE_AUTOPAUSE
          value: 'false'
        - name: MODRINTH_PROJECTS
          value: 'fabric-api

            luckperms

            chunky

            lithium

            ferrite-core

            skill-proficiencies

            krypton

            c2me-fabric:0.4.2-alpha.0.56+26.2

            carpet

            spark

            vmp-fabric:0.2.0+beta.7.236+26.2

            alternate-current

            noisiumforked

            ksyxis

            servercore

            farmers-delight-refabricated

            harvest-simplified

            more-delight

            ubes-delight

            rustic-delight

            spanish-delight-refabricated

            appleskin

            brewery

            chefs-delight

            crate-delight

            dungeons-and-taverns

            towns-and-towers

            explorify

            repurposed-structures-fabric

            explorations

            terralith

            tectonic

            incendium:5.5.1

            nullscape

            structory

            ct-overhaul-village

            hopo-better-mineshaft

            hopo-better-underwater-ruins

            moogs-voyager-structures

            mes-moogs-end-structures

            natures-compass

            explorers-compass

            travelersbackpack

            jade

            clumps

            universal-graves

            friends-and-foes

            double-doors

            open-parties-and-claims:fabric-26.2-0.32.7

            styled-chat

            crafting-tweaks

            toms-storage

            storagedrawers

            waystones

            veinminer

            fallingtree

            adorn

            macaws-furniture

            blockus

            modern-decorations-mod

            additional-lanterns

            macaws-lights-and-lamps

            macaws-doors

            macaws-bridges

            macaws-windows

            macaws-roofs

            rechiseled

            diagonal-fences

            skniros-furniture

            bluemap

            polymer

            lithostitched

            forge-config-api-port

            puzzles-lib

            collective

            resourceful-lib

            moogs-structure-lib

            supermartijn642s-core-lib

            delight-lib

            supermartijn642s-config-lib

            fusion-connected-textures

            cristel-lib

            fabric-language-kotlin

            balm

            shogi

            wizards

            spell-engine

            spell-power

            runes

            player-animation-library

            armor-model-api

            structure-pool-api

            serene-seasons:beta

            glitchcore:beta

            vanilla-npcs

            '
        image: itzg/minecraft-server:java25
        imagePullPolicy: IfNotPresent
        name: junismp
        ports:
        - containerPort: 25565
          hostPort: 25565
          protocol: TCP
        resources:
          limits:
            memory: 8Gi
          requests:
            cpu: 1500m
            memory: 7Gi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /data
          name: data
      dnsPolicy: ClusterFirst
      nodeSelector:
        kubernetes.io/hostname: junilab
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - name: backup-data
        persistentVolumeClaim:
          claimName: junismp-backup-data
      - name: data
        persistentVolumeClaim:
          claimName: junismp-data
