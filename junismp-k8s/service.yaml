apiVersion: v1
kind: Service
metadata:
  name: junismp
  namespace: minecraft
spec:
  clusterIP: None
  clusterIPs:
  - None
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: mc
    port: 25565
    protocol: TCP
    targetPort: 25565
  - name: voice
    port: 24454
    protocol: UDP
    targetPort: 24454
  selector:
    app: junismp
  sessionAffinity: None
  type: ClusterIP
