services:
  mc:
    image: itzg/minecraft-server:java25
    tty: true
    stdin_open: true
    restart: unless-stopped
    ports:
      - "25565:25565"
      - "8100:8100"
      - "8080:8080"
    volumes:
      - ./mc-data:/data
      - ./bluemap:/data/config/bluemap
      - ./Pl3xMap:/data/config/Pl3xMap
    env_file:
      - path: .env
        required: false
    environment:
      EULA: "TRUE"
      TYPE: FABRIC
      VERSION: "26.2"
      FABRIC_LOADER_VERSION: "0.19.5"
      MEMORY: 6G
      USE_AIKAR_FLAGS: "true"
      JVM_OPTS: "-Xms6G -Xmx6G -XX:+UseG1GC"
      MAX_PLAYERS: 20
      MODE: survival
      DIFFICULTY: normal
      MOTD: "Juni's Fabric server"
      ENABLE_RCON: "true"
      RCON_PASSWORD: ${RCON_PASSWORD:?create /root/mc-fabric/.env containing RCON_PASSWORD=<secret>}
      VIEW_DISTANCE: 7
      SIMULATION_DISTANCE: 4
      SYNC_CHUNK_WRITES: "false"
      MAX_CHAINED_NEIGHBOR_UPDATES: 10000
      ENABLE_AUTOPAUSE: "false"
      MODRINTH_PROJECTS: |
        fabric-api
        luckperms
        chunky
        lithium
        ferrite-core
        skill-proficiencies
        krypton
        c2me-fabric
        carpet
        spark
        vmp-fabric
        alternate-current
        noisiumforked
        ksyxis
        servercore
        farmers-delight-refabricated
        harvest-simplified
        more-delight
        ubes-delight
        rustic-delight
        spanish-delight-refabricated
        appleskin
        dungeons-and-taverns
        towns-and-towers
        explorify
        repurposed-structures-fabric
        explorations
        waystones
        veinminer
        fallingtree
        adorn
        macaws-furniture
        blockus
        modern-decorations-mod
        additional-lanterns
        macaws-lights-and-lamps
        bluemap
        pl3xmap
  playit:
    image: ghcr.io/playit-cloud/playit-agent:latest
    restart: unless-stopped
    network_mode: host
    env_file:
      - path: .env
        required: false
    environment:
      SECRET_KEY: ${PLAYIT_SECRET:?create /root/mc-fabric/.env containing PLAYIT_SECRET=<secret from https://playit.gg/account/setup/wizard/new-account/docker/docker-name>}
