services:
  mc:
    image: itzg/minecraft-server:java25
    tty: true
    stdin_open: true
    restart: unless-stopped
    ports:
      - "25565:25565"
    volumes:
      - ./mc-data:/data
    env_file:
      - path: /root/mc-fabric/.env
        required: false
    environment:
      # mc-image-helper's mod downloader uses Netty's async DNS resolver, which
      # talks to nameservers directly and ignores /etc/hosts entirely -- an
      # extra_hosts pin for api.modrinth.com (tried first) had zero effect
      # because of this. Docker's bridge network has no IPv6 egress (daemon-wide
      # IPv6 is off), so when DNS returns an AAAA-only/AAAA-preferred answer for
      # a Cloudflare-fronted host, the handshake just times out. Force IPv4-only
      # at the JVM level instead -- covers mc-image-helper and the server JVM.
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
      EULA: "TRUE"
      TYPE: FABRIC
      VERSION: "26.2"
      FABRIC_LOADER_VERSION: "0.19.5"
      MEMORY: 6G
      USE_AIKAR_FLAGS: "true"
      MAX_PLAYERS: 20
      MODE: survival
      DIFFICULTY: normal
      MOTD: "Juni's Fabric server"
      ENABLE_RCON: "true"
      VIEW_DISTANCE: 7
      SIMULATION_DISTANCE: 6
      ENABLE_AUTOPAUSE: "false"
      MODRINTH_PROJECTS: |
        fabric-api
        luckperms
        chunky
        lithium
        ferrite-core
        skill-proficiencies
        krypton
        farmers-delight-refabricated
        harvest-simplified
        more-delight
        appleskin
        dungeons-and-taverns
        towns-and-towers
        explorify
        repurposed-structures-fabric
        explorations
        waystones
        veinminer
        fallingtree
        ubes-delight
        rustic-delight
        spanish-delight-refabricated
        adorn
        blockus
        macaws-furniture
        macaws-lights-and-lamps
        jade
        c2me-fabric:alpha
        alternate-current
        debugify
        sound-physics-remastered:beta
        delight-lib
        cloth-config
        cristel-lib
        fabric-language-kotlin
        balm
        shogi
  playit:
    image: ghcr.io/playit-cloud/playit-agent:latest
    restart: unless-stopped
    network_mode: host
    env_file:
      - path: /root/mc-fabric/.env
        required: false
    environment:
      # PLAYIT_SECRET in /root/mc-fabric/.env must be exposed to this container as
      # SECRET_KEY (image's own expected name) -- env_file only passes vars through
      # under their original name, it cannot rename, and Claude is hard-blocked from
      # ever reading/sourcing that file directly (CC Safety Net secret.basename.env).
      # User action needed: either add a second line SECRET_KEY=<same value> to that
      # .env file, or run `set -a; source /root/mc-fabric/.env; set +a` themselves
      # before `docker compose up -d` so this interpolates for real.
      SECRET_KEY: ${PLAYIT_SECRET}

networks:
  default:
    driver_opts:
      com.docker.network.driver.mtu: 1380
