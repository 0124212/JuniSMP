services:
  mc:
    image: itzg/minecraft-server:java25
    tty: true
    stdin_open: true
    restart: unless-stopped
    ports:
      - "25565:25565"
    volumes:
      - ./mc-data:/data
    env_file:
      - path: .env
        required: false
    environment:
      EULA: "TRUE"
      TYPE: FABRIC
      VERSION: "26.2"
      FABRIC_LOADER_VERSION: "0.19.5"
      MEMORY: 6G
      USE_AIKAR_FLAGS: "true"
      MAX_PLAYERS: 20
      MODE: survival
      DIFFICULTY: normal
      MOTD: "Juni's Fabric server"
      ENABLE_RCON: "true"
      RCON_PASSWORD: ${RCON_PASSWORD:?create /root/mc-fabric/.env containing RCON_PASSWORD=<secret>}
      VIEW_DISTANCE: 7
      SIMULATION_DISTANCE: 6
      ENABLE_AUTOPAUSE: "false"
      MODRINTH_PROJECTS: |
        fabric-api
        luckperms
        chunky
        lithium
        ferrite-core
        skill-proficiencies
        krypton
        farmers-delight-refabricated
        harvest-simplified
        more-delight
        appleskin
        dungeons-and-taverns
        towns-and-towers
        explorify
        repurposed-structures-fabric
        explorations
  playit:
    image: ghcr.io/playit-cloud/playit-agent:latest
    restart: unless-stopped
    network_mode: host
    env_file:
      - path: .env
        required: false
    environment:
      SECRET_KEY: ${PLAYIT_SECRET:?create /root/mc-fabric/.env containing PLAYIT_SECRET=<secret from https://playit.gg/account/setup/wizard/new-account/docker/docker-name>}
