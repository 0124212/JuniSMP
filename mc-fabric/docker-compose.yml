services:
  mc:
    image: itzg/minecraft-server:java25
    tty: true
    stdin_open: true
    restart: unless-stopped
    ports:
      - "25565:25565"
      - "8100:8100"
    volumes:
      - ./mc-data:/data
      - ./bluemap:/data/config/bluemap
    env_file:
      - path: .env
        required: false
    environment:
      EULA: "TRUE"
      TYPE: FABRIC
      VERSION: "26.2"
      FABRIC_LOADER_VERSION: "0.19.5"
      MEMORY: 6G
      USE_AIKAR_FLAGS: "true"
      JVM_OPTS: "-Xms6G -Xmx6G -XX:+UseG1GC"
      MAX_PLAYERS: 20
      MODE: survival
      DIFFICULTY: normal
      MOTD: "Juni's Fabric server"
      ENABLE_RCON: "true"
      RCON_PASSWORD: ${RCON_PASSWORD:?create /root/mc-fabric/.env containing RCON_PASSWORD=<secret>}
      VIEW_DISTANCE: 7
      SIMULATION_DISTANCE: 4
      SYNC_CHUNK_WRITES: "false"
      MAX_CHAINED_NEIGHBOR_UPDATES: 10000
      ENABLE_AUTOPAUSE: "false"
      MODRINTH_PROJECTS: |
        fabric-api
        luckperms
        chunky
        lithium
        ferrite-core
        skill-proficiencies
        krypton
        c2me-fabric:0.4.2-alpha.0.56+26.2
        carpet
        spark
        vmp-fabric:0.2.0+beta.7.236+26.2
        alternate-current
        noisiumforked
        ksyxis
        servercore
        farmers-delight-refabricated
        harvest-simplified
        more-delight
        ubes-delight
        rustic-delight
        spanish-delight-refabricated
        appleskin
        brewery
        chefs-delight
        crate-delight
        dungeons-and-taverns
        towns-and-towers
        explorify
        repurposed-structures-fabric
        explorations
        terralith
        tectonic
        incendium:5.5.1
        nullscape
        structory
        ct-overhaul-village
        hopo-better-mineshaft
        hopo-better-underwater-ruins
        moogs-voyager-structures
        mes-moogs-end-structures
        natures-compass
        explorers-compass
        travelersbackpack
        jade
        clumps
        universal-graves
        friends-and-foes
        double-doors
        open-parties-and-claims:fabric-26.2-0.32.7
        styled-chat
        crafting-tweaks
        toms-storage
        storagedrawers
        waystones
        veinminer
        fallingtree
        adorn
        macaws-furniture
        blockus
        modern-decorations-mod
        additional-lanterns
        macaws-lights-and-lamps
        macaws-doors
        macaws-bridges
        macaws-windows
        macaws-roofs
        rechiseled
        diagonal-fences
        skniros-furniture
        bluemap
        # --- transitive dependencies (verified 2026-10-09; the above entries
        # don't declare these on Modrinth's own metadata, but Fabric's loader
        # hard-requires them at boot) ---
        polymer
        lithostitched
        forge-config-api-port
        puzzles-lib
        collective
        resourceful-lib
        moogs-structure-lib
        supermartijn642s-core-lib
        delight-lib
        supermartijn642s-config-lib
        fusion-connected-textures
        cristel-lib
        fabric-language-kotlin
        balm
        shogi
  playit:
    image: ghcr.io/playit-cloud/playit-agent:latest
    restart: unless-stopped
    network_mode: host
    env_file:
      - path: .env
        required: false
    environment:
      SECRET_KEY: ${PLAYIT_SECRET:?create /root/mc-fabric/.env containing PLAYIT_SECRET=<secret from https://playit.gg/account/setup/wizard/new-account/docker/docker-name>}
